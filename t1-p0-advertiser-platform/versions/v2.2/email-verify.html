<!doctype html><html lang="zh-CN"><head><script src="../../versioning/storage.js"></script><script src="assets/review-sandbox.js?v=20260928"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T1 · 邮箱验证</title><style>body{margin:0;background:#f5f6fa;color:#192435;font:15px/1.8 system-ui,sans-serif;padding:64px 20px}main{max-width:520px;background:white;border:1px solid #e5e8ef;border-radius:16px;padding:32px;margin:auto;overflow-wrap:anywhere}h1{font-size:24px}button,a{display:inline-block;border:0;border-radius:8px;background:#525ce5;color:white;padding:10px 20px;text-decoration:none;font:inherit;cursor:pointer}.note{color:#687589;font-size:13px}.brand{color:#525ce5;font-weight:700;letter-spacing:2px}</style></head><body><main><div class="brand">T1 广告平台</div><section id="result"></section><p class="note">交互演示：本页仅处理当前浏览器的样例数据，不验证真实邮箱。</p></main><script src="assets/v22-account.js?v=20261102-email"></script><script>
const id=new URLSearchParams(location.search).get('id'),S=V22Account,box=document.getElementById('result');
function render(){const status=S.linkStatus(id);box.replaceChildren();const h=document.createElement('h1'),p=document.createElement('p');h.textContent=status==='complete'?'邮箱验证成功':status==='valid'?'确认验证邮箱':status==='expired'?'验证链接已过期':'验证链接不可用';p.textContent=status==='complete'?'已验证邮箱：'+S.profile().email+'。今后请使用此邮箱登录，原密码不变；广告主关联、余额和历史数据保持不变。':status==='valid'?'即将验证 '+S.read().pendingVerification.email+'。确认后该邮箱用于登录和找回密码。':status==='expired'?'账号信息尚未更改，请返回账号与验证重新发送邮件。':'此链接已被新链接替代，或与当前账号不匹配。请使用最新邮件；账号信息未因此改变。';box.append(h,p);if(status==='valid'){const b=document.createElement('button');b.textContent='确认验证';b.onclick=()=>{S.completeVerification(id);render()};box.append(b)}else{const a=document.createElement('a');a.textContent='返回T1';a.href='dsp.html?demo=1&'+(window.T1_REVIEW?'review=1&':'')+'email=1';box.append(a)}}
// Opening the email link completes verification, as agreed. Repeated links are idempotent.
if(S.linkStatus(id)==='valid')S.completeVerification(id);render();
addEventListener('storage',()=>render());
</script></body></html>
