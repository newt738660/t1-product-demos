<script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TODAY='2026-11-05', CUTOFF=TODAY+' 16:00:00', COLORS={reg:'#3575ed',login:'#16a387',bind:'#8762d8'},LABELS={reg:'新增注册用户',login:'登录用户',bind:'首次绑定用户'};
function plus(date,n){const d=new Date(date+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
const users=[],logins=[],bindings=[];const companies=['星海互动','远山科技','蓝鲸传媒','青禾网络','云帆互娱','北辰数字'];
for(let i=0;i<148;i++){
 const date=plus('2026-10-01',Math.floor(i*35/148)),hour=8+i%7, submitted=date+` ${String(hour).padStart(2,'0')}:10:00`,done=date<'2026-10-30'||i%13!==0,completed=done?date+` ${String(hour).padStart(2,'0')}:18:00`:null;
 const u={id:'U-'+(10001+i),account:'client_'+String(i+1).padStart(3,'0'),email:`client${i+1}@example.com`,submitted,completed,origin:i%3===0?'邀请注册':'普通注册'}; users.push(u);
 if(!done)continue;
 for(let d=0;d<=35;d++){const day=plus(date,d);if(day>TODAY)break;if(d===0||(i+d)%5===0){logins.push({id:`L-${i}-${d}`,uid:u.id,time:day+' 14:30:00',method:(i+d)%2?'邮箱':'账号'});if((i+d)%4===0)logins.push({id:`L-${i}-${d}b`,uid:u.id,time:day+' 15:20:00',method:'邮箱'});}}
 if(i%4!==0){const day=plus(date,1+i%3);if(day<=TODAY){bindings.push({id:'B-'+(8001+i),uid:u.id,time:day+' 15:00:00',ad:'ADV-'+(70285+i%6),name:companies[i%6],source:['邀请绑定','绑定申请通过','开户后关联'][i%3],ref:(i%3===0?'INV-':'APP-')+(9000+i),first:true});if(i%17===0&&plus(day,3)<=TODAY)bindings.push({id:'B-R'+i,uid:u.id,time:plus(day,3)+' 15:00:00',ad:'ADV-'+(70285+(i+1)%6),name:companies[(i+1)%6],source:'绑定申请通过',ref:'APP-R'+i,first:false});}}
}
// Fixed-day samples make the three distinct metrics inspectable.
for(let i=0;i<7;i++){const id='U-'+(11001+i),time=TODAY+' '+(9+i)+':10:00';const u={id,account:'new_user_'+(i+1),email:`new${i+1}@example.com`,submitted:time,completed:i===6?null:TODAY+' '+String(9+i).padStart(2,'0')+':20:00',origin:i%2?'邀请注册':'普通注册'};u.submitted=TODAY+' '+String(9+i).padStart(2,'0')+':10:00';users.push(u);if(u.completed){logins.push({id:'L-N'+i,uid:id,time:TODAY+' 15:40:00',method:i%2?'邮箱':'账号'});if(i<3)bindings.push({id:'B-N'+i,uid:id,time:TODAY+' 15:45:00',ad:'ADV-'+(70285+i),name:companies[i],source:['邀请绑定','绑定申请通过','开户后关联'][i],ref:'APP-N'+i,first:true});}}
const byId=Object.fromEntries(users.map(u=>[u.id,u]));let current='reg',start=TODAY,end=TODAY,page=1,mode='normal',returnFocus=null;const size=8;
function inRange(t){return t&&t.slice(0,10)>=start&&t.slice(0,10)<=end&&t<=CUTOFF}function unique(a,key='uid'){return new Set(a.map(x=>x[key])).size}function activeData(a){return mode==='empty'?[]:a}
function range(p){end=p==='yesterday'?plus(TODAY,-1):TODAY;start=['today','yesterday'].includes(p)?end:plus(end,-Number(p)+1);$('from').value=start;$('to').value=end;document.querySelectorAll('[data-range]').forEach(b=>b.classList.toggle('selected',b.dataset.range===p));$('error').textContent='';page=1;render()}
function applyRange(){const a=$('from').value,b=$('to').value;if(!a||!b||a>b){$('error').textContent='请选择有效的起止日期';return}if(a<'2026-10-01'||b>TODAY){$('error').textContent='演示可查询 2026-10-01 至 2026-11-05';return}start=a;end=b;page=1;$('error').textContent='';document.querySelectorAll('[data-range]').forEach(x=>x.classList.remove('selected'));render()}
function stats(){const us=activeData(users),ls=activeData(logins),bs=activeData(bindings);return {reg:us.filter(u=>inRange(u.completed)).length,pending:us.filter(u=>inRange(u.submitted)&&!u.completed).length,login:unique(ls.filter(l=>inRange(l.time))),loginTimes:ls.filter(l=>inRange(l.time)).length,bind:unique(bs.filter(b=>b.first&&inRange(b.time))),bindEvents:bs.filter(b=>inRange(b.time)).length}}
function render(){const s=stats();$('cards').innerHTML=[['reg','新增注册用户',s.reg,'＋',`按注册完成时间 · 待激活提交 ${s.pending} 人`],['login','登录用户',s.login,'↗',`区间去重 · 成功登录 ${s.loginTimes} 次`],['bind','首次绑定用户',s.bind,'⇄',`首次绑定成功 · 全部绑定记录 ${s.bindEvents} 条`]].map(([k,t,v,icon,n])=>`<button class="card" onclick="drill('${k}')"><div>${t}</div><span class="symbol">${icon}</span><div class="num">${mode==='error'?'—':v}<span class="unit">人</span></div><div class="cardfoot">${mode==='error'?'数据暂不可用，请重试':n}　<span style="float:right;color:var(--blue)">查看明细 →</span></div></button>`).join('');renderChart();renderTable()}
function days(){const rows=[];for(let d=start;d<=end;d=plus(d,1)){rows.push({day:d,reg:activeData(users).filter(u=>u.completed?.slice(0,10)===d).length,login:unique(activeData(logins).filter(l=>l.time.slice(0,10)===d)),bind:unique(activeData(bindings).filter(b=>b.first&&b.time.slice(0,10)===d))});}return rows}
function renderChart(){const ds=days();$('rangeLabel').textContent=start+' — '+end;if(mode==='error'){$('chart').innerHTML='<div class="empty">趋势数据加载失败，请刷新重试</div>';$('dailyTable').innerHTML='';return}const selected=$('metric').value,keys=selected==='all'?['reg','login','bind']:[selected],max=Math.max(4,...ds.flatMap(d=>keys.map(k=>d[k]))),top=Math.ceil(max/4)*4,W=Math.max(310,Math.round($('chart').clientWidth)-44),H=240,L=38,R=20,T=22,B=34;const x=i=>ds.length===1?W/2:L+i*(W-L-R)/(ds.length-1),y=v=>H-B-v*(H-T-B)/top;let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="每日注册、登录及首次绑定人数趋势，数值可通过按日数据查看">`;for(let j=0;j<=4;j++){const v=j*top/4;svg+=`<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="#edf1f7" stroke-dasharray="4 4"/><text x="${L-10}" y="${y(v)+4}" text-anchor="end" fill="#94a0b1" font-size="11">${v}</text>`}ds.forEach((d,i)=>{if(ds.length<9||i%Math.ceil(ds.length/(W<500?3:7))===0||i===ds.length-1)svg+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" fill="#94a0b1" font-size="11">${d.day.slice(5)}</text>`});if(ds.length===1){keys.forEach((k,j)=>{const bx=L+(j+.5)*(W-L-R)/keys.length,bw=Math.min(46,(W-L-R)/keys.length*.35);svg+=`<rect x="${bx-bw/2}" y="${y(ds[0][k])}" width="${bw}" height="${H-B-y(ds[0][k])}" rx="4" fill="${COLORS[k]}"/><text x="${bx}" y="${y(ds[0][k])-8}" text-anchor="middle" fill="${COLORS[k]}" font-size="12">${ds[0][k]}</text>`})}else keys.forEach(k=>{svg+=`<polyline fill="none" stroke="${COLORS[k]}" stroke-width="2.5" stroke-linejoin="round" points="${ds.map((d,i)=>x(i)+','+y(d[k])).join(' ')}"/>`;ds.forEach((d,i)=>{svg+=`<circle cx="${x(i)}" cy="${y(d[k])}" r="${ds.length===1?5:3}" fill="${COLORS[k]}" stroke="white" stroke-width="1.5"><title>${d.day} ${LABELS[k]}：${d[k]}人</title></circle>`;if(ds.length===1)svg+=`<text x="${x(i)+12}" y="${y(d[k])-8}" fill="${COLORS[k]}" font-size="11">${LABELS[k]} ${d[k]}</text>`})});svg+='</svg>';$('chart').innerHTML=svg;$('dailyTable').innerHTML='<table><thead><tr><th>日期</th><th>新增注册</th><th>登录用户</th><th>首次绑定</th></tr></thead><tbody>'+ds.map(d=>`<tr><td>${d.day}</td><td>${d.reg}</td><td>${d.login}</td><td>${d.bind}</td></tr>`).join('')+'</tbody></table>'}
function toggleDaily(){$('dailyTable').hidden=!$('dailyTable').hidden}
function tab(k){current=k;page=1;$('search').value='';$('tabFilters').innerHTML=k==='reg'?'<select id="dateField" aria-label="注册时间类型" onchange="page=1;renderTable()"><option value="completed">按完成时间</option><option value="submitted">按提交时间</option></select> <select id="status" aria-label="注册状态" onchange="page=1;renderTable()"><option value="all">全部状态</option><option value="done">已完成</option><option value="pending">待激活</option></select>':k==='bind'?'<select id="bindType" aria-label="绑定范围" onchange="page=1;renderTable()"><option value="all">全部成功绑定</option><option value="first">仅首次绑定</option></select> <select id="source" aria-label="绑定来源" onchange="page=1;renderTable()"><option value="all">全部来源</option><option>邀请绑定</option><option>绑定申请通过</option><option>开户后关联</option></select>':'';renderTable()}
function drill(k){tab(k);if(k==='reg')$('status').value='done';if(k==='bind')$('bindType').value='first';renderTable();$('details').scrollIntoView({behavior:'smooth',block:'start'})}
function resetFilters(){tab(current)}
function records(){let a;if(mode==='error')return [];if(current==='reg'){const field=$('dateField')?.value||'completed',st=$('status')?.value||'all';a=activeData(users).filter(u=>inRange(u[field])&&(st==='all'||(st==='done'?!!u.completed:!u.completed))).map(u=>({...u,uid:u.id,time:u[field]}));}else if(current==='login')a=activeData(logins).filter(l=>inRange(l.time));else a=activeData(bindings).filter(b=>inRange(b.time)&&($('bindType')?.value!=='first'||b.first)&&($('source')?.value==='all'||b.source===$('source')?.value));const q=$('search').value.trim().toLowerCase();return a.filter(r=>{const u=byId[r.uid];return !q||[u.id,u.account,u.email,r.ad,r.name,r.ref].join(' ').toLowerCase().includes(q)}).sort((a,b)=>b.time.localeCompare(a.time)||a.id.localeCompare(b.id))}
function userCell(r){const u=byId[r.uid];return `<button class="link" onclick="openUser('${u.id}')">${u.account}</button><span class="cellsub">${u.id}</span>`}
function renderTable(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.id==='tab-'+current));const rows=records(),total=rows.length,count=Math.max(1,Math.ceil(total/size));page=Math.min(page,count);const note=current==='reg'?`按${$('dateField')?.value==='submitted'?'提交':'完成'}时间查询；每行一个用户。` :current==='login'?`共 ${unique(rows)} 位用户、${total} 次成功登录；每行一次登录。`:'每行一次成功绑定；“仅首次绑定”与顶部首次绑定用户指标对应。';$('detailnote').textContent=note+' 日期沿用顶部筛选；关键词和下方条件仅影响明细。';$('export').disabled=mode==='error'||total===0;
if(mode==='error'){$('table').innerHTML='<div class="empty">明细加载失败，数据暂不可用。<br><button onclick="refreshData()">重试</button></div>';}else if(!total){$('table').innerHTML='<div class="empty">当前条件下暂无记录<br><span class="cellsub">可调整日期或重置明细筛选。待激活用户请按提交时间查询。</span></div>';}else{const headers=current==='reg'?['用户 / ID','邮箱','提交时间','完成时间','状态','注册来源']:current==='login'?['登录时间','用户 / ID','邮箱','登录方式']:['绑定成功时间','用户 / ID','广告主 / ID','绑定来源','关联编号','绑定类型'];$('table').innerHTML='<table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.slice((page-1)*size,page*size).map(r=>{const u=byId[r.uid];const cells=current==='reg'?[userCell(r),esc(u.email),esc(u.submitted),esc(u.completed||'—'),`<span class="pill ${u.completed?'':'pending'}">${u.completed?'已完成':'待激活'}</span>`,`<span class="source">${u.origin}</span>`]:current==='login'?[r.time,userCell(r),esc(u.email),r.method]:[r.time,userCell(r),`${esc(r.name)}<span class="cellsub">${r.ad}</span>`,`<span class="source">${r.source}</span>`,r.ref,r.first?'首次绑定':'再次绑定'];return '<tr>'+cells.map(c=>'<td>'+c+'</td>').join('')+'</tr>'}).join('')+'</tbody></table>'}$('pager').innerHTML=`<span>${mode==='error'?'—':total} 条记录 · 每页 ${size} 条</span><span><button aria-label="上一页" ${page<=1?'disabled':''} onclick="page--;renderTable()">‹</button> ${page} / ${count} <button aria-label="下一页" ${page>=count?'disabled':''} onclick="page++;renderTable()">›</button></span>`}
function openPanel(title,html){returnFocus=document.activeElement;$('drawerTitle').textContent=title;$('drawerBody').innerHTML=html;$('overlay').hidden=false;document.body.style.overflow='hidden';document.querySelector('.drawer .close').focus()}
function openUser(id){const u=byId[id],ls=logins.filter(l=>l.uid===id).sort((a,b)=>b.time.localeCompare(a.time)),bs=bindings.filter(b=>b.uid===id).sort((a,b)=>b.time.localeCompare(a.time)),last=bs[0];openPanel('用户详情',`<div class="userhero"><h2>${u.account}</h2><span class="muted">${u.id} · ${u.email}</span></div><p class="muted">用户完整记录 · 截至 ${CUTOFF}（UTC+8）</p><dl class="facts"><dt>注册来源</dt><dd>${u.origin}</dd><dt>提交时间</dt><dd>${u.submitted}</dd><dt>完成时间</dt><dd>${u.completed||'待激活'}</dd><dt>最近成功登录</dt><dd>${ls[0]?.time||'暂无登录记录'}</dd><dt>当前广告主</dt><dd>${last?last.name+' / '+last.ad:'尚未绑定'}</dd><dt>登录记录</dt><dd>${ls.length} 次成功登录</dd></dl><h2>接入过程</h2><ol class="timeline"><li>提交注册<span class="cellsub">${u.submitted}</span></li>${u.completed?`<li>注册完成<span class="cellsub">${u.completed}</span></li>`:'<li>等待邮箱激活</li>'}${bs.slice().reverse().map(b=>`<li>${b.first?'首次':'再次'}绑定 · ${b.name}<span class="cellsub">${b.time} · ${b.source}<br>${b.ad} · ${b.ref}</span></li>`).join('')}</ol><button onclick="viewUserLogins('${id}')">查看该用户在当前日期范围的登录明细</button>`)}
function viewUserLogins(id){closeDrawer();tab('login');$('search').value=id;renderTable();$('details').scrollIntoView({behavior:'smooth'})}
function closeDrawer(){$('overlay').hidden=true;document.body.style.overflow='';returnFocus?.focus()}
document.addEventListener('keydown',e=>{if($('overlay').hidden)return;if(e.key==='Escape')closeDrawer();if(e.key==='Tab'){const els=[...$('overlay').querySelectorAll('button,input,select,a[href]')],first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function showDefinition(){openPanel('指标口径',`<dl class="facts"><dt>新增注册用户</dt><dd>按用户首次注册完成时间统计。新激活机制上线后的注册，以激活完成为准；老用户补验不是新注册。</dd><dt>登录用户</dt><dd>所选日期区间内成功登录的独立用户，按稳定用户ID去重。保持登录会话不等于发生新的登录事件，因此此指标不称为活跃用户。</dd><dt>首次绑定用户</dt><dd>用户第一次成功绑定广告主的时间落在所选区间。绑定申请提交不计为绑定成功；再次绑定仅进入全部绑定明细。</dd><dt>日期</dt><dd>演示采用UTC+8，包含起止日期，固定截至2026-11-05 16:00。正式业务时区和历史覆盖需确认。</dd><dt>数据来源</dt><dd>本页全部虚构样例，注册、登录、绑定事件关联同一用户ID。真实历史缺失须标为未知。</dd><dt>转化分析</dt><dd>当天绑定与注册可能来自不同批次用户，不能直接相除作为转化率。</dd></dl>`)}
function setMode(v){mode=v;page=1;render();toast(v==='normal'?'已恢复正常演示数据':v==='empty'?'已切换无数据场景':'已切换加载失败场景')}
async function refreshData(){const b=$('refresh');b.disabled=true;b.textContent='刷新中…';await new Promise(r=>setTimeout(r,450));mode='normal';render();b.disabled=false;b.textContent='↻ 刷新数据';$('updated').textContent='数据截至 2026-11-05 16:00 · 已刷新演示快照';toast('演示数据已刷新')}
function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').hidden=true,2600)}
function csvCell(v){let s=String(v??'');if(/^[=+@\-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function exportCSV(){const rs=records();if(!rs.length)return;const head=current==='reg'?['用户ID','注册账号','邮箱','提交时间','完成时间','状态','注册来源']:current==='login'?['登录记录ID','登录时间','用户ID','注册账号','邮箱','登录方式']:['绑定记录ID','绑定成功时间','用户ID','注册账号','邮箱','广告主ID','广告主名称','绑定来源','关联编号','是否首次绑定'];const lines=rs.map(r=>{const u=byId[r.uid];return current==='reg'?[u.id,u.account,u.email,u.submitted,u.completed||'',u.completed?'已完成':'待激活',u.origin]:current==='login'?[r.id,r.time,u.id,u.account,u.email,r.method]:[r.id,r.time,u.id,u.account,u.email,r.ad,r.name,r.source,r.ref,r.first?'是':'否']});const csv='\uFEFF'+[['统计时区','UTC+8','演示数据截至',CUTOFF],head,...lines].map(row=>row.map(csvCell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=`T1_${current}_${start}_${end}_演示.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(`已导出 ${rs.length} 条筛选明细`)}
